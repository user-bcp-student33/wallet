spring.application.name=backend

spring.datasource.url=jdbc:h2:mem:wallet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

wallet.cors.allowed-origins=http://localhost:4200
wallet.security.pbkdf2-iterations=1000
wallet.analytics.api-key=test-analytics-key
