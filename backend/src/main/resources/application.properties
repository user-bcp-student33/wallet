spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/wallet_db
spring.datasource.username=wallet_user
spring.datasource.password=wallet_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Wallet
wallet.cors.allowed-origins=http://localhost:4200
wallet.security.pbkdf2-iterations=600000
# Vacia deshabilita /analytics/**; definir WALLET_ANALYTICS_API_KEY para habilitarlo.
wallet.analytics.api-key=${WALLET_ANALYTICS_API_KEY:}
