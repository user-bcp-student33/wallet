<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>Wallet Perú — Tu dinero, más cerca</title><style>

:root{--ink:#14223d;--muted:#7c889d;--blue:#4458ed;--dark:#293dbe;--line:#e8edf5;--bg:#f5f7fc;--green:#159b77}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#edf2ff,#f8fafc 60%,#eefaf8);color:var(--ink);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b5bfff;outline-offset:2px}.app{max-width:440px;min-height:100dvh;margin:auto;background:#fff;box-shadow:0 20px 80px #293b7914;overflow:hidden}.screen{min-height:100dvh;padding:29px 27px 26px;display:flex;flex-direction:column;animation:appear .25s ease}@keyframes appear{from{opacity:.4;transform:translateY(7px)}to{opacity:1;transform:none}}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-family:Manrope,sans-serif;font-size:18px;font-weight:800;letter-spacing:-.7px}.brandmark{height:39px;width:39px;border-radius:13px;background:linear-gradient(145deg,#5868f8,#3549c8);display:grid;place-items:center;color:#fff;box-shadow:0 6px 15px #4458ed35}.brandmark svg{width:25px;height:25px}.tiny{font-size:11px;color:var(--muted)}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);font-size:23px}.pill{background:#edf1ff;color:#4a5bd0;font-size:11px;font-weight:800;padding:9px 12px;border-radius:999px}.hero{margin:44px 0 30px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}h1{font-family:Manrope,sans-serif;font-size:30px;line-height:1.23;letter-spacing:-1.3px;margin:13px 0 12px;font-weight:800}p{line-height:1.65}.subtitle{font-size:14px;color:var(--muted);margin:0}.art{height:278px;position:relative;display:grid;place-items:center;margin:22px 0 8px;background:radial-gradient(ellipse,#e6ebff 0%,#f6f8ff 54%,transparent 73%);border-radius:40px}.orb{width:208px;height:208px;background:linear-gradient(145deg,#5267f6,#283bb3);border-radius:62px;transform:rotate(-13deg);box-shadow:0 26px 40px #4254d94a;display:grid;place-items:center}.orb svg{width:126px;height:126px;transform:rotate(13deg);color:white}.float{position:absolute;background:white;border:1px solid #eef0f9;border-radius:16px;padding:11px 13px;box-shadow:0 12px 32px #203b7d19;font-size:12px;font-weight:800}.float.a{top:35px;right:5px}.float.b{bottom:38px;left:1px}.dot{display:inline-block;width:9px;height:9px;background:#17b58b;border-radius:50%;margin-right:6px}.grow{flex:1}.actions{display:grid;gap:12px;margin-top:25px}.btn{border:0;border-radius:16px;min-height:54px;padding:14px 18px;font-weight:800;font-size:14px;transition:transform .15s,box-shadow .15s}.btn:active{transform:scale(.985)}.btn.primary{color:white;background:linear-gradient(100deg,#5064f3,#3a4cd2);box-shadow:0 12px 22px #4358e92b}.btn.secondary{background:#f3f5ff;color:#3f50d2}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.legal{text-align:center;font-size:11px;color:#9ca7b9;margin:20px 0 0}.section-title{margin-top:33px;margin-bottom:7px}.section-title h1{margin:0 0 9px;font-size:27px}.form{margin-top:29px;display:grid;gap:21px}.label{font-size:12px;font-weight:800;margin-bottom:9px;display:block}.fieldwrap{position:relative}.field{width:100%;border:1.5px solid #e6eaf3;background:#fbfcff;border-radius:15px;min-height:54px;padding:14px 15px;color:var(--ink);outline:none;font-size:15px;transition:border .2s,box-shadow .2s}.field:focus{border-color:#6173f5;box-shadow:0 0 0 4px #5c6ef114;background:white}.field::placeholder{color:#abb5c6}.help{font-size:11px;color:var(--muted);margin:7px 0 0}.inline{display:flex;gap:13px;align-items:center}.inline>*{flex:1;min-width:0}.secure{display:flex;align-items:center;gap:8px;padding:13px;border-radius:13px;background:#f2f8f7;color:#4d8175;font-size:11px;margin-top:7px}.error{font-size:12px;color:#d33b5a;min-height:16px}.progress{height:5px;background:#edf0f7;border-radius:5px;margin:25px 0 10px;overflow:hidden}.progress span{display:block;width:33%;height:100%;background:var(--blue);border-radius:5px}.showpass{position:absolute;right:11px;top:10px;background:none;border:0;color:var(--blue);font-size:12px;font-weight:800;padding:10px}.avatar{height:46px;width:46px;border-radius:16px;background:#e9edff;color:#5260c7;display:grid;place-items:center;font-weight:800;flex:none}.contact{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.contact strong{font-size:13px}.contact small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.paybtn{margin-left:auto;border:0;background:#eef1ff;color:#4355d5;border-radius:11px;padding:11px 14px;font-weight:800;font-size:12px}.search{margin-top:24px}.balance{background:linear-gradient(135deg,#354acb,#6576f5);border-radius:23px;padding:24px;color:white;box-shadow:0 17px 35px #4055df2c;margin:25px 0}.balance small{opacity:.8}.balance strong{display:block;font:800 33px Manrope;margin-top:10px}.status{display:inline-flex;background:#e8f9f3;color:#168a68;padding:8px 13px;border-radius:30px;font-size:11px;font-weight:800}.success{height:84px;width:84px;border-radius:27px;background:#e9faf4;color:#0fa87d;display:grid;place-items:center;font-size:45px;margin:auto auto 24px}.amount{font:800 46px Manrope;letter-spacing:-2px;text-align:center;margin:22px 0}.detail{background:#f7f9fd;padding:17px;border-radius:17px;font-size:13px}.detail div{display:flex;justify-content:space-between;margin:8px 0;gap:12px}.detail span{color:var(--muted)}.detail b{text-align:right}.footer-note{font-size:11px;color:#a1aabd;text-align:center;margin:15px 0 0}@media(min-width:600px){.app{min-height:calc(100vh - 50px);margin:25px auto;border-radius:30px}.screen{min-height:calc(100vh - 50px)}}
@media(max-width:599px){html,body{width:100%;min-width:0;overflow-x:hidden}.app{width:100%;max-width:none;box-shadow:none}.screen{padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));min-height:100svh}.top{align-items:flex-start}.pill{font-size:10px;padding:8px 9px;max-width:150px;text-align:center}.hero{margin:30px 0 15px}h1{font-size:clamp(25px,7vw,30px)}.art{height:clamp(180px,31vh,260px);margin:12px 0}.orb{width:clamp(145px,42vw,190px);height:clamp(145px,42vw,190px);border-radius:46px}.orb svg{width:100px;height:100px}.float{font-size:10px;padding:9px}.form{gap:17px;margin-top:23px}.section-title{margin-top:25px}.balance{margin:18px 0}.btn{min-height:52px}.contact{gap:9px}.contact strong{font-size:12px}.paybtn{padding:10px}.brand{font-size:16px}}@media(max-width:360px){.screen{padding-left:15px;padding-right:15px}.pill{max-width:120px}.float.a{right:0}.float.b{left:0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:360px){.screen{padding-left:16px!important;padding-right:16px!important}.pill{font-size:10px!important}.hero h1{font-size:34px!important}}
</style></head><body><main class="app" id="app"><section class="screen"><div class="top"><div class="brand"><span class="brandmark">↗</span><span>Wallet Perú</span></div><span class="pill">Pagos entre contactos</span></div><div class="hero"><span class="eyebrow">Pagos simples y cercanos</span><h1>Tu dinero,<br>más cerca de todos.</h1><p class="subtitle">Envía dinero a tus contactos de forma sencilla.</p></div><div class="art"><div class="orb" style="color:white;font-size:90px">↗</div><div class="float a">Conecta y paga</div><div class="float b">Tus contactos, más cerca</div></div><div class="grow"></div><div class="actions"><button class="btn primary" onclick="go('register')">Crear una cuenta →</button><button class="btn secondary" onclick="go('login')">Ya tengo una cuenta</button></div></section></main><script>
const state={page:'home',phone:'',query:'',recipient:null,amount:0,users:[{name:'Ana Torres',phone:'987 654 321'},{name:'Carlos Mendoza',phone:'912 345 678'},{name:'Lucía Quispe',phone:'955 443 322'},{name:'Miguel Rojas',phone:'933 221 144'}]};
const icon='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="13" r="5"/><circle cx="35" cy="13" r="5"/><path d="M3 30c0-7 4-10 10-10 4 0 7 2 9 5M45 30c0-7-4-10-10-10-4 0-7 2-9 5"/><path d="M13 37h22m-7-7 7 7-7 7m-15-14-7 7 7 7"/></svg>';
const brand=()=>`<div class="brand"><span class="brandmark">${icon}</span><span>Wallet Perú</span></div>`;
const headerView=(back=false)=>`<div class="top">${back?`<button class="back" aria-label="Volver" onclick="back()">‹</button>`:brand()}<span class="pill">↗ Pagos entre contactos</span></div>`;
const shell=s=>`<section class="screen">${s}</section>`;const note='<p class="footer-note">Wallet Perú · Tu dinero, más cerca</p>';
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page){state.page=page;render();window.scrollTo(0,0)}
function back(){const routes={register:'home',login:'home',contacts:'home',payment:'contacts',review:'payment',done:'contacts',approved:'home'};go(routes[state.page]||'home')}
function render(){let s='';switch(state.page){
case'home':s=shell(`${headerView()}<div class="hero"><span class="eyebrow">Pagos simples y cercanos</span><h1>Tu dinero,<br>más cerca de todos.</h1><p class="subtitle">Envía dinero a tus contactos en pocos pasos. Fácil, rápido y desde donde estés.</p></div><div class="art"><div class="orb">${icon}</div><div class="float a"><span class="dot"></span>Conecta y paga</div><div class="float b">↗ Envía a tus contactos</div></div><div class="grow"></div><div class="actions"><button class="btn primary" onclick="go('register')">Crear una cuenta →</button><button class="btn secondary" onclick="go('login')">Ya tengo una cuenta</button></div>${note}`);break;
case'register':s=shell(`${headerView(true)}<div class="progress"><span></span></div><div class="tiny">PASO 1 DE 3 · CONFIGURA TU CUENTA</div><div class="section-title"><h1>Crear una cuenta</h1><p class="subtitle">Comencemos con tus datos para conectar tu billetera.</p></div><form class="form" onsubmit="register(event)"><div><label class="label" for="card">Número de tarjeta</label><input class="field" id="card" inputmode="numeric" autocomplete="off" maxlength="23" placeholder="0000 0000 0000 0000" oninput="formatCard(this)" required></div><div><label class="label" for="cvv">CVV</label><input class="field" id="cvv" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="•••" oninput="digits(this,4)" required><p class="help">Para explorar esta interfaz, utiliza únicamente datos de prueba.</p></div><div><label class="label" for="phone">Número de celular</label><div class="fieldwrap"><input class="field" id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="9" placeholder="987 654 321" oninput="digits(this,9)" required></div><p class="help">Usarás este número para ingresar a tu cuenta.</p></div><div><label class="label" for="pass">Crea tu contraseña</label><div class="fieldwrap"><input class="field" id="pass" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required><button type="button" class="showpass" onclick="togglePass('pass',this)">Mostrar</button></div></div><div class="secure">♢ &nbsp; Tus datos deben verificarse mediante una conexión segura.</div><div class="error" id="error" role="alert"></div><button class="btn primary" type="submit">Continuar →</button></form><div class="grow"></div>${note}`);break;
case'login':s=shell(`${headerView(true)}<div class="section-title" style="margin-top:65px"><span class="eyebrow">Bienvenido de nuevo</span><h1>Ingresa a tu cuenta</h1><p class="subtitle">Tus contactos están a un paso.</p></div><form class="form" onsubmit="login(event)"><div><label class="label" for="login-phone">Número de celular</label><input class="field" id="login-phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="9" placeholder="987 654 321" oninput="digits(this,9)" required></div><div><label class="label" for="login-pass">Contraseña</label><div class="fieldwrap"><input class="field" id="login-pass" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required><button type="button" class="showpass" onclick="togglePass('login-pass',this)">Mostrar</button></div></div><div class="error" id="error" role="alert"></div><button class="btn primary" type="submit">Ingresar →</button></form><div class="grow"></div><p style="text-align:center;font-size:13px;color:var(--muted)">¿Aún no tienes cuenta? <button onclick="go('register')" style="border:0;background:none;color:var(--blue);font-weight:800">Crear una cuenta</button></p>${note}`);break;
case'loading':s=shell(`${headerView()}<div class="grow" style="display:grid;place-content:center;text-align:center"><div style="font-size:44px;color:var(--blue);margin-bottom:20px">◌</div><h1>Preparando tu billetera</h1><p class="subtitle">Estamos configurando tu experiencia.</p></div>${note}`);break;
case'approved':s=shell(`${headerView()}<div class="grow" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="success">✓</div><span class="status" style="align-self:center">Cuenta lista</span><h1>¡Bienvenido a Wallet Perú!</h1><p class="subtitle">Ya puedes explorar los pagos entre contactos.</p><div class="balance" style="text-align:left"><small>Saldo disponible</small><strong>S/ 0.00</strong><small>Tu billetera</small></div></div><button class="btn primary" onclick="go('contacts')">Ir a mis contactos →</button>${note}`);break;
case'contacts':{const q=state.query.toLowerCase();const users=state.users.filter(u=>u.name.toLowerCase().includes(q)||u.phone.replaceAll(' ','').includes(q.replaceAll(' ','')));s=shell(`${headerView()}<div class="section-title"><span class="eyebrow">Transferencias</span><h1>Pagos entre contactos</h1><p class="subtitle">Elige a quién deseas enviar dinero.</p></div><div class="balance"><small>Saldo disponible</small><strong>S/ 0.00</strong><small>Wallet Perú</small></div><label class="label" for="search">Buscar contacto</label><input class="field search" style="margin-top:0" id="search" placeholder="Nombre o número de celular" value="${escapeHTML(state.query)}" oninput="searchContacts(this)"><div style="margin:27px 0 10px;font-size:12px;font-weight:800">Tus contactos</div><div class="grow">${users.map(u=>`<div class="contact"><div class="avatar">${u.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div><div><strong>${escapeHTML(u.name)}</strong><small>+51 ${escapeHTML(u.phone)}</small></div><button class="paybtn" onclick="choose('${u.phone}')">Pagar ↗</button></div>`).join('')||'<p class="subtitle">No encontramos contactos con ese nombre.</p>'}</div><button class="btn ghost" onclick="go('home')">Cerrar sesión</button>${note}`);break;}
case'payment':s=shell(`${headerView()}<div class="section-title"><span class="eyebrow">Nuevo pago</span><h1>Enviar dinero</h1><p class="subtitle">A ${escapeHTML(state.recipient?.name||'tu contacto')}</p></div><form class="form" onsubmit="payment(event)"><div><label class="label" for="amount">Monto a enviar (S/)</label><input class="field" id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div><div class="detail"><div><span>Destinatario</span><b>${escapeHTML(state.recipient?.name||'')}</b></div><div><span>Celular</span><b>+51 ${escapeHTML(state.recipient?.phone||'')}</b></div></div><div class="error" id="error"></div><button class="btn primary">Revisar pago →</button></form><div class="grow"></div><button class="btn ghost" onclick="go('contacts')">Volver a contactos</button>${note}`);break;
case'review':s=shell(`${headerView()}<div class="section-title"><span class="eyebrow">Revisión de pago</span><h1>Confirma los datos</h1><p class="subtitle">Revisa los detalles antes de continuar.</p></div><div class="amount">S/ ${state.amount.toFixed(2)}</div><div class="detail"><div><span>Destinatario</span><b>${escapeHTML(state.recipient?.name||'')}</b></div><div><span>Celular</span><b>+51 ${escapeHTML(state.recipient?.phone||'')}</b></div><div><span>Importe</span><b>S/ ${state.amount.toFixed(2)}</b></div></div><div class="grow"></div><p class="subtitle" style="font-size:12px;text-align:center;margin-bottom:16px">Revisa cuidadosamente los datos del destinatario.</p><button class="btn primary" onclick="go('done')">Confirmar →</button><button class="btn ghost" style="margin-top:10px" onclick="go('payment')">Editar monto</button>`);break;
case'done':s=shell(`${headerView()}<div class="grow" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="success">✓</div><h1>¡Listo!</h1><p class="subtitle">Has completado los pasos para enviar a ${escapeHTML(state.recipient?.name||'tu contacto')}.</p><div class="detail" style="margin-top:28px"><div><span>Monto indicado</span><b>S/ ${state.amount.toFixed(2)}</b></div><div><span>Estado</span><b>Solicitud preparada</b></div></div></div><button class="btn primary" onclick="go('contacts')">Volver a mis contactos</button>${note}`);break;
}const root=document.getElementById('app');if(root)root.innerHTML=s}
function digits(el,n){el.value=el.value.replace(/\D/g,'').slice(0,n)}function formatCard(el){el.value=el.value.replace(/\D/g,'').slice(0,19).replace(/(.{4})/g,'$1 ').trim()}function togglePass(id,btn){let e=document.getElementById(id);e.type=e.type==='password'?'text':'password';btn.textContent=e.type==='password'?'Mostrar':'Ocultar'}function error(msg){const e=document.getElementById('error');if(e)e.textContent=msg}
function register(e){e.preventDefault();const card=document.getElementById('card').value.replace(/\D/g,''),cvv=document.getElementById('cvv').value,phone=document.getElementById('phone').value,pass=document.getElementById('pass').value;if(card.length<13||card.length>19)return error('Revisa el número de tarjeta.');if(!/^\d{3,4}$/.test(cvv))return error('Ingresa un CVV de 3 o 4 dígitos.');if(!/^9\d{8}$/.test(phone))return error('Ingresa un celular peruano válido de 9 dígitos.');if(pass.length<8)return error('La contraseña debe tener al menos 8 caracteres.');state.phone=phone;/* No conservar tarjeta, CVV ni contraseña */go('loading');setTimeout(()=>{if(state.page==='loading')go('approved')},900)}
function login(e){e.preventDefault();const phone=document.getElementById('login-phone').value,pass=document.getElementById('login-pass').value;if(!/^9\d{8}$/.test(phone))return error('Ingresa un celular peruano válido.');if(!pass)return error('Ingresa tu contraseña.');state.phone=phone;go('contacts')}
function searchContacts(el){state.query=el.value;const pos=el.selectionStart;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)}function choose(phone){state.recipient=state.users.find(u=>u.phone===phone);go('payment')}function payment(e){e.preventDefault();state.amount=Number(document.getElementById('amount').value);if(!Number.isFinite(state.amount)||state.amount<=0)return error('Ingresa un monto válido.');go('review')}try{render()}catch(err){console.error('Wallet render error',err)}
</script></body></html>
